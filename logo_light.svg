<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0078D4"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
  </defs>

  <!-- ICON -->
  <g transform="translate(24, 24)">
    <!-- Roof -->
    <path d="M 10 46 L 56 10 L 102 46" fill="none" stroke="url(#blueGrad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Garage Body / Calendar -->
    <path d="M 14 46 L 14 96 C 14 104 20 110 28 110 L 84 110 C 92 110 98 104 98 96 L 98 46 Z" fill="url(#blueGrad)"/>
    
    <!-- Calendar Lines -->
    <g fill="#FFFFFF">
      <rect x="24" y="58" width="40" height="6" rx="3"/>
      <rect x="24" y="74" width="40" height="6" rx="3"/>
      <rect x="24" y="90" width="24" height="6" rx="3"/>
    </g>

    <!-- Checkmark (Slightly lighter charcoal for contrast on blue) -->
    <path d="M 54 78 L 68 92 L 92 62" fill="none" stroke="#374151" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- WORDMARK -->
  <g font-family="Inter, -apple-system, sans-serif" font-weight="800" font-size="54" letter-spacing="-1.5">
    <!-- "Garage" in WHITE for dark mode -->
    <text x="150" y="102" fill="#FFFFFF">Garage</text>
    <!-- "Log" in blue gradient -->
    <text x="350" y="102" fill="url(#blueGrad)">Log</text>
  </g>
</svg>