<div class="col-md-6 col-lg-4">
    <section class="card h-100" aria-labelledby="card-{{ slug }}">
        <div class="card-body">
            <h2 class="h5 card-title" id="card-{{ slug }}">{{ title }}</h2>
            <p class="display-6 mb-1">{{ count }}</p>
            <p class="card-text text-body-secondary">{{ text }}</p>
            <a class="stretched-link" href="{{ url }}">{{ link_text }}<span class="visually-hidden">: {{ title }}</span></a>
        </div>
    </section>
</div>
