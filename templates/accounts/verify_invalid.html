{% extends 'base.html' %}

{% block title %}Link not valid | GarageLog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <h1 class="h2 mb-3">This verification link isn't valid</h1>
        <p>The link may have expired, or it may already have been used. You can request a new one.</p>
        <a class="btn btn-primary" href="{% url 'accounts:resend_verification' %}">Resend verification email</a>
    </div>
</div>
{% endblock %}
