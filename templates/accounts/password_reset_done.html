{% extends 'base.html' %}

{% block title %}Check your email | GarageLog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <h1 class="h2 mb-3">Check your email</h1>
        <p>If an account exists for that email address, we've sent a link to reset your password. It may take a minute to arrive.</p>
        <a class="btn btn-primary" href="{% url 'accounts:login' %}">Back to log in</a>
    </div>
</div>
{% endblock %}
