{% extends 'base.html' %}

{% block title %}{{ page_title }} | GarageLog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <h1 class="h2 mb-3">{{ page_title }}</h1>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'includes/form.html' with form=form %}
            <button type="submit" class="btn btn-primary">{% if booking %}Save changes{% else %}Submit booking{% endif %}</button>
            <a class="btn btn-link" href="{% if booking %}{% url 'booking_detail' booking.pk %}{% else %}{% url 'booking_list' %}{% endif %}">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        // Only show "Other service" when "Other" is picked. Without JavaScript the field simply stays visible.
        var serviceSelect = document.getElementById('id_service_type');
        var otherInput = document.getElementById('id_other_service');
        if (serviceSelect && otherInput) {
            var otherGroup = otherInput.closest('.mb-3');
            var toggleOther = function () {
                var isOther = serviceSelect.value === 'Other';
                otherGroup.hidden = !isOther;
                otherInput.required = isOther;
            };
            serviceSelect.addEventListener('change', toggleOther);
            toggleOther();
        }

        // Staff: only offer the options that belong to whatever is chosen in the field above them
        // (vehicles for the selected customer, mechanics for the selected workshop). Without
        // JavaScript every option is listed and the server still rejects a mismatch.
        function linkSelects(parentId, childId, attribute, labels) {
            var parentSelect = document.getElementById(parentId);
            var childSelect = document.getElementById(childId);
            if (!parentSelect || !childSelect) { return; }

            var allOptions = Array.prototype.slice.call(childSelect.options).map(function (option) {
                return { value: option.value, text: option.text, tag: option.getAttribute(attribute) };
            });
            var status = document.createElement('div');
            status.className = 'form-text';
            status.setAttribute('aria-live', 'polite');
            childSelect.parentNode.insertBefore(status, childSelect.nextSibling);

            var filter = function () {
                var parent = parentSelect.value;
                var previous = childSelect.value;
                var matches = allOptions.filter(function (option) {
                    return option.value !== '' && option.tag === parent;
                });

                childSelect.innerHTML = '';
                var placeholder = document.createElement('option');
                placeholder.value = '';
                placeholder.textContent = !parent ? labels.choose
                    : matches.length ? labels.pick : labels.none;
                childSelect.appendChild(placeholder);
                matches.forEach(function (option) {
                    var element = document.createElement('option');
                    element.value = option.value;
                    element.textContent = option.text;
                    element.setAttribute(attribute, option.tag);
                    childSelect.appendChild(element);
                });

                // Keep the chosen option only if it still belongs to the newly selected parent.
                childSelect.value = previous;
                if (childSelect.value !== previous) { childSelect.selectedIndex = 0; }

                status.textContent = !parent ? ''
                    : matches.length + (matches.length === 1 ? ' ' + labels.one : ' ' + labels.many);
            };

            parentSelect.addEventListener('change', filter);
            filter();
        }

        linkSelects('id_customer', 'id_vehicle', 'data-owner', {
            choose: 'Select a customer first', pick: 'Select a vehicle', none: 'This customer has no vehicles',
            one: 'vehicle available for this customer.', many: 'vehicles available for this customer.'
        });
        linkSelects('id_workshop', 'id_mechanic', 'data-workshop', {
            choose: 'Select a workshop first', pick: 'Not assigned yet', none: 'No mechanics at this workshop',
            one: 'mechanic at this workshop.', many: 'mechanics at this workshop.'
        });
    });
</script>
{% endblock %}
